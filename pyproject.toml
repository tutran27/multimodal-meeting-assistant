[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-smart-personal-assistant"
version = "0.1.0"
description = "Multi-modal Smart Personal Assistant for automated meeting extraction, planning, and task orchestration."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.12",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.1",
    "requests>=2.31.0",
    "groq>=0.11.0",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-groq>=0.2.0",
    "transformers>=4.40.0",
    "sentence-transformers>=3.0.0",
    "huggingface-hub>=0.24.0",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "paddleocr[all]>=2.8.0",
    "python-docx>=1.1.0",
    "pypdf>=4.0.0",
    "reportlab>=4.0.0",
    "tavily-python>=0.5.0",
    "google-api-python-client>=2.150.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.0",
    "streamlit>=1.38.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]
